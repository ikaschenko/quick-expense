<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QuickExpense — Admin Log Viewer</title>
<style>
  :root { color-scheme: dark; }
  body { font-family: ui-monospace, "Cascadia Code", Consolas, monospace; background: #16181d; color: #d8dbe0; margin: 0; padding: 16px; font-size: 13px; }
  h1 { font-size: 16px; margin: 0 0 12px; }
  .toolbar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  select, input, button { background: #24272e; color: #d8dbe0; border: 1px solid #3a3d45; border-radius: 4px; padding: 6px 8px; font: inherit; }
  input[type="text"] { flex: 1; min-width: 200px; }
  button { cursor: pointer; }
  button:hover { background: #2f333c; }
  #status { color: #8a8f99; margin-bottom: 8px; }
  #entries { border: 1px solid #3a3d45; border-radius: 4px; max-height: 75vh; overflow-y: auto; }
  .entry { padding: 6px 10px; border-bottom: 1px solid #24272e; white-space: pre-wrap; word-break: break-word; }
  .entry.error { background: #2a1518; color: #ff8a8a; }
  .entry.warn { background: #2a2313; color: #ffcf7a; }
  .entry.info { color: #d8dbe0; }
  .meta { color: #8a8f99; }
</style>
</head>
<body>
<h1>QuickExpense — Admin Log Viewer</h1>
<div class="toolbar">
  <select id="file"></select>
  <select id="level">
    <option value="">All levels</option>
    <option value="error">Error</option>
    <option value="warn">Warn</option>
    <option value="info">Info</option>
  </select>
  <input type="text" id="q" placeholder="Search…">
  <input type="number" id="lines" value="200" min="1" max="1000" style="width:80px" title="Lines">
  <button id="refresh">Refresh</button>
</div>
<div id="status"></div>
<div id="entries"></div>

<script src="/logs.js" defer></script>
</body>
</html>
