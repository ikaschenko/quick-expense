# fly.toml app configuration file generated for q-expense on 2026-03-17T14:59:08+01:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'q-expense-app'
primary_region = 'fra'

[build]

[env]
  NODE_ENV = 'production'
  PORT = '3001'
  LOG_DIR = '/data/logs'
  LOG_RETENTION_DAYS = '15'
  LOG_MAX_TOTAL_MB = '50'
  ALERT_ERROR_THROTTLE_MS = '300000'
  ALERT_WARNING_DIGEST_INTERVAL_HOURS = '24'
  ALERT_EMAIL_SUBJECT_PREFIX = '[QuickExpense Alert]'

[[mounts]]
  source = 'qe_logs'
  destination = '/data/logs'

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
  cpus = 1
  memory_mb = 256
