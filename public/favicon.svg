<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F6F8FB"/>
      <stop offset="100%" stop-color="#E3E8F0"/>
    </linearGradient>
    <linearGradient id="qGrad" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#8896A8"/>
      <stop offset="100%" stop-color="#3E4C5E"/>
    </linearGradient>
    <linearGradient id="xGrad" x1="10%" y1="10%" x2="90%" y2="90%">
      <stop offset="0%" stop-color="#E14545"/>
      <stop offset="100%" stop-color="#8C1F1F"/>
    </linearGradient>
    <radialGradient id="discGrad" cx="35%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E7ECF2"/>
    </radialGradient>
    <filter id="softShadow" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="3.5" stdDeviation="3" flood-color="#1E293B" flood-opacity="0.34"/>
    </filter>
    <filter id="softShadowInner" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="1.6" stdDeviation="2" flood-color="#1E293B" flood-opacity="0.27"/>
    </filter>
  </defs>

  <!-- Squircle background -->
  <rect x="0" y="0" width="120" height="120" rx="26" ry="26" fill="url(#bgGrad)"/>
  <rect x="1" y="1" width="118" height="118" rx="25" ry="25" fill="none" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="1"/>

  <!-- Inner disc (Q counter) -->
  <circle cx="58.72" cy="58.72" r="27.55" fill="url(#discGrad)" filter="url(#softShadowInner)"/>

  <!-- Q ring (gray/subtle-blue) -->
  <circle cx="58.72" cy="58.72" r="39.15" fill="none" stroke="url(#qGrad)" stroke-width="21.75" filter="url(#softShadow)"/>

  <!-- X overlay merging into Q's tail (red-ish) -->
  <g filter="url(#softShadow)">
    <rect x="54.37" y="78.30" width="66.70" height="18.85" rx="9.43" fill="url(#xGrad)" transform="rotate(45 87.72 87.72)"/>
    <rect x="54.37" y="78.30" width="66.70" height="18.85" rx="9.43" fill="url(#xGrad)" transform="rotate(-45 87.72 87.72)"/>
  </g>
</svg>
