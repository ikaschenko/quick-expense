sonar.organization=ikaschenko
sonar.projectKey=ikaschenko_quick-expense
sonar.projectName=QuickExpense

#Path to production source directories
sonar.sources=app-web,app-server,landing

#Path to test directories (analyzed as test code, not production code)
sonar.tests=tests

#Exclude node_modules and build output from analysis
sonar.exclusions=**/node_modules/**,**/dist/**

#Static marketing site has no test harness; keep it in analysis but out of coverage
sonar.coverage.exclusions=landing/**

#Source code language and encoding
sonar.sourceEncoding=UTF-8

#Test coverage report, generated via `npm run test:coverage`
sonar.javascript.lcov.reportPaths=coverage/lcov.info